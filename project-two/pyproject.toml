[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-coding-agent-ollama"
version = "0.1.0"
description = "Minimal standalone coding agent backed by Ollama"
requires-python = ">=3.10"

[project.scripts]
mini-coding-agent = "mini_coding_agent:main"

[tool.setuptools]
py-modules = ["mini_coding_agent", "agent_skills"]
